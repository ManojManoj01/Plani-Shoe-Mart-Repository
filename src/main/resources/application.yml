# ==============================================================================
# Shoe Shop Backend - Production Spring Boot 3 Application Configuration
# Shared PostgreSQL database hosted on Supabase (Port 6543 / 5432)
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: shoe-shop-backend

  # ----------------------------------------------------------------------------
  # Supabase PostgreSQL Database Configuration
  # SSL & Connection-Pooler note:
  # Supabase uses PgBouncer on port 6543 (transaction mode) and direct Postgres on 5432.
  # The JDBC URL must include ?sslmode=require for secure encrypted SSL connection.
  # ----------------------------------------------------------------------------
  datasource:
    url: ${SUPABASE_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}}
    username: ${SUPABASE_DB_USER:${SUPABASE_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres.rlryucrhtugglzefnwxq}}}
    password: ${SUPABASE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:Manojshoeshop}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      keepalive-time: 30000

  # ----------------------------------------------------------------------------
  # JPA & Hibernate Configuration
  # STRICT CONSTRAINT: ddl-auto must be 'validate' or 'none', NEVER 'update' or 'create'
  # ----------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Flyway Database Migration
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: false

  # Multipart Upload Settings (5MB max image, 10MB request)
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  # Email Configuration (Default dev mode)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ------------------------------------------------------------------------------
# Application Custom Security, Storage & CORS Configuration
# ------------------------------------------------------------------------------
app:
  # Supabase Storage Bucket Configuration
  # Uses official Supabase Storage REST API (https://<project-ref>.supabase.co/storage/v1)
  supabase:
    url: ${SUPABASE_URL:${SUPABASE_STORAGE_URL:}}
    key: ${SUPABASE_SERVICE_KEY:${SUPABASE_SERVICE_ROLE_KEY:${SUPABASE_KEY:}}}
    bucket: ${SUPABASE_STORAGE_BUCKET:product-images}

  # Dashboard Low Stock Threshold Configuration
  dashboard:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:10}

  # Local filesystem fallback directory for product images
  upload:
    dir: ${UPLOAD_DIR:uploads/products}

  # JWT Token Generation & Verification
  jwt:
    secret: ${JWT_SECRET:StepStyleFootwearStoreSecretKeyMustBeAtLeast256BitsLongForHmacSha256Security12345}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    refresh-cookie-name: stepstyle_refresh_token

  # CORS Allowed Origins
  # Both Admin Panel (port 4201) and Customer Website (port 4200)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201,http://localhost:4200}

  # Admin Startup Bootstrap
  # Password is read from ADMIN_BOOTSTRAP_PASSWORD environment variable (never hardcoded)
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@stepstyle.com}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      first-name: ${ADMIN_BOOTSTRAP_FIRST_NAME:System}
      last-name: ${ADMIN_BOOTSTRAP_LAST_NAME:Administrator}

  mail:
    dev-mode: ${MAIL_DEV_MODE:true}
    from-email: ${MAIL_FROM:noreply@stepstyle.com}

  frontend:
    reset-password-url: ${FRONTEND_RESET_PASSWORD_URL:http://localhost:4200/reset-password}

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
