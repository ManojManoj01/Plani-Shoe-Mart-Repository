# ==============================================================================
# StepStyle Footwear Store - H2 In-Memory Test Configuration
# Completely isolated, offline, zero-network requirement for tests
# ==============================================================================

spring.datasource.url=jdbc:h2:mem:stepstyle_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway disabled during unit/integration tests (schema auto-created by Hibernate)
spring.flyway.enabled=false

# Test JWT settings
app.jwt.secret=TestSecretKeyForTestingMustBeAtLeast256BitsLongForHmacSha256Security1234567890
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000
app.jwt.refresh-cookie-name=stepstyle_refresh_token

# Test CORS & Mail
app.cors.allowed-origins=http://localhost:4200
app.mail.dev-mode=true
app.mail.from-email=noreply@stepstyle.com
app.frontend.reset-password-url=http://localhost:4200/reset-password
app.upload.dir=target/test-uploads
